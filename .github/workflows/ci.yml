name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check gmail_mcp tests
      - name: Run mocked tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install and verify distribution
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m pip check
          python -I -c 'import importlib.metadata as m; import gmail_mcp.server; assert next(iter(m.entry_points(group="console_scripts", name="gmail-mcp"))).load() is gmail_mcp.server.main; assert gmail_mcp.server.auth._store is None'
          gmail-mcp-mail-only --help
